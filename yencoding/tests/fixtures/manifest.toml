# yEnc fixture manifest
#
# All fixtures generated by gen_fixtures.py using pure Python arithmetic.
# CRC32 values are computed over the *decoded* payload (not the encoded bytes)
# using Python's binascii.crc32(), matching the yEnc spec.
#
# Oracle: Python 3, binascii.crc32(), no yEnc library.
# Generation command: python3 gen_fixtures.py

[[fixture]]
filename = "single_part.yenc"
source = "generated by Python yenc_encode() — see gen_fixtures.py"
article_filename = "test.bin"
expected_decoded_len = 64
expected_crc32 = "100ece8c"
is_multipart = false
is_truncated = false
has_preamble = false
expected_error = ""
notes = "Payload is bytes(range(64)). Byte 19 encodes to '=' and is escaped as '=}'."

