[package]
name = "mime-tree"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RFC 5322/MIME parser producing a byte-range-indexed part tree"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-mime"
readme = "README.md"
keywords = ["mime", "email", "rfc5322", "parser", "s-mime"]
categories = ["email", "encoding", "parser-implementations"]

[dependencies]
mail-parser = { version = "0.11", default-features = false, features = ["serde", "full_encoding"] }
encoding_rs = "0.8"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
quoted_printable = "0.5"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
uuencoding = { version = "0.3.0", path = "../uuencoding" }
yencoding = { version = "0.2.0", path = "../yencoding" }
