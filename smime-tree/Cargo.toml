[package]
name = "smime-tree"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "S/MIME sign/verify/encrypt/decrypt via key traits"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-mime"
readme = "README.md"
keywords = ["smime", "cms", "pkcs7", "email", "cryptography"]
categories = ["cryptography", "email", "encoding"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[dependencies]
base64 = { version = "0.23" }
cms = { version = "=0.3.0-rc.2" }
crypto-common = { version = "0.2" }
elliptic-curve = { version = "0.14", features = ["ecdh"] }
const-oid = { version = "0.10", features = ["db"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
ansi-x963-kdf = { version = "0.1" }
# `zeroize`: wipe expanded AES key schedules (and GHASH / CBC state) on drop.
aes-kw = { version = "0.3", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
cbc = { version = "0.2", features = ["alloc", "zeroize"] }
sha2 = { version = "0.11" }
der = { version = "0.8" }
spki = { version = "0.8" }
signature = { version = "3" }
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
subtle = { version = "2" }
zeroize = { version = "1", features = ["zeroize_derive"] }
# Certificate chain validation via the PKIX crate family.
# pkix-chain still uses x509-cert 0.2, while the rest of smime-tree uses
# x509-cert 0.3 (required by the `cms` crate). Certificates are bridged
# via DER round-trip in cert.rs (GitHub issue #2).
pkix-chain = { version = "0.4", features = ["rustcrypto"] }
x509-cert-stable = { package = "x509-cert", version = "0.2" }
der-stable = { package = "der", version = "0.7" }
# signature 2.x is the error type of pkix-chain's `SignatureVerifier` trait,
# implemented by `cert::SmimeChainVerifier`.
signature-stable = { package = "signature", version = "2" }

[dev-dependencies]
mime-tree = { version = "0.6.1", path = "../mime-tree" }
tempfile = "3"
